name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64  go build -ldflags='-s -w' -o dist/gitty-linux-amd64   ./cmd/gitty/
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64  go build -ldflags='-s -w' -o dist/gitty-linux-arm64   ./cmd/gitty/
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64  go build -ldflags='-s -w' -o dist/gitty-darwin-amd64  ./cmd/gitty/
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64  go build -ldflags='-s -w' -o dist/gitty-darwin-arm64  ./cmd/gitty/
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64  go build -ldflags='-s -w' -o dist/gitty.exe           ./cmd/gitty/
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64  go build -ldflags='-s -w' -o dist/gitty-windows-arm64.exe ./cmd/gitty/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gitty-linux-amd64
            dist/gitty-linux-arm64
            dist/gitty-darwin-amd64
            dist/gitty-darwin-arm64
            dist/gitty.exe
            dist/gitty-windows-arm64.exe
          generate_release_notes: true
